name: MOVA Custom Voice Pack
version: "1.1.0"
slug: mova_voicepack
description: >-
  Build and install custom voice packs for MOVA/Dreame robot vacuums from typed
  text (Piper TTS) or uploaded audio. Self-serve, over the LAN.
url: "https://github.com/agentemes/ha-mova-voicepack"
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web app (add to your phone home screen) — http://<HA-IP>:8099
panel_icon: mdi:robot-vacuum-variant
panel_title: Voice Pack
hassio_api: true
homeassistant_api: true
map:
  - homeassistant_config:rw
options:
  vacuum_entity: vacuum.p10_pro_ultra
  ha_base_url: "http://192.168.1.136"
schema:
  vacuum_entity: str
  ha_base_url: str
